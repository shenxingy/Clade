name: CI

# THROWAWAY PROBE BRANCH — never merged. Traces the commit-archeology
# concurrent-refresh double scan on a hosted runner with the #212 lock.
on:
  pull_request:
    branches: [main]

jobs:
  probe:
    name: Probe commit-archeology concurrency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Concurrent creation race, 300 rounds of 4
        run: bash tests/probe-mkdir-race.sh
