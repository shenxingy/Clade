name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Real-API tier (job `real-api-loop` below): manual or weekly only —
  # push/PR CI stays free and deterministic on mocked claude.
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Python syntax check
        run: |
          echo "Checking Python syntax..."
          find orchestrator/ -name "*.py" | while read f; do
            python -m py_compile "$f" && echo "OK: $f" || exit 1
          done

      # py_compile proves a file PARSES. It cannot see a name that is never
      # bound, so this repo shipped two live NameErrors under a green syntax
      # gate — both of which this linter found on its first run (they are named
      # in orchestrator/ruff.toml, parked there so this gate could land green,
      # each to be deleted with its one-line fix).
      #
      # Rules and the MEASURED ignore baseline live in orchestrator/ruff.toml.
      # The version is read out of orchestrator/requirements-dev.txt so a local
      # `ruff check` and this step can never disagree about which ruff ran.
      # This installs a TOOL, not project dependencies: the stdlib-only rule for
      # the configs/scripts/ gates below is untouched, and the shellcheck step
      # further down already apt-installs its tool the same way.
      - name: Python lint gate (ruff)
        run: |
          pin="$(grep -E '^ruff==[0-9]' orchestrator/requirements-dev.txt || true)"
          if [ -z "$pin" ]; then
            echo "::error::orchestrator/requirements-dev.txt has no 'ruff==<version>' pin; this gate reads the version from there"
            exit 1
          fi
          echo "Installing $pin"
          pip install "$pin"
          ruff check --config orchestrator/ruff.toml .

      - name: Shell syntax check (hooks)
        run: |
          echo "Checking shell syntax..."
          find configs/hooks/ -name "*.sh" | while read f; do
            bash -n "$f" && echo "OK: $f" || exit 1
          done

      - name: Shell syntax check (scripts)
        run: |
          find configs/scripts/ -name "*.sh" | while read f; do
            bash -n "$f" && echo "OK: $f" || exit 1
          done

      # Same script committer.sh runs locally before every commit — one gate,
      # shared local/CI (checks.sh skips silently when shellcheck is missing,
      # so install it explicitly to keep this a hard gate here)
      - name: Shellcheck gate (shared checks.sh)
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          bash configs/scripts/checks.sh shellcheck configs/hooks/*.sh configs/hooks/lib/*.sh configs/scripts/*.sh install.sh

      - name: Install test (dry run)
        run: |
          chmod +x install.sh
          bash -n install.sh && echo "install.sh syntax OK"

      - name: Validate skill registry
        run: python3 configs/scripts/validate-skills.py configs/skills

      # mcp-package/skills/ is a DERIVED copy of configs/skills/ (curated by
      # mcp-package/skills.list, bundled into the clade-mcp wheel). Regenerate
      # into a tmpdir and diff — editing configs/skills/ without re-running the
      # regenerator ships a stale/broken skill copy to PyPI.
      - name: mcp-package skills drift gate
        run: |
          tmp="$(mktemp -d)"
          bash configs/scripts/regen-mcp-package.sh "$tmp"
          if ! diff -r "$tmp" mcp-package/skills; then
            echo "::error::mcp-package/skills/ drifted from configs/skills/ — run: configs/scripts/regen-mcp-package.sh (then commit the result)"
            exit 1
          fi

      # Codex executes SKILL.md directly, so the native plugin combines each
      # curated canonical SKILL.md + prompt.md into a generated distribution.
      - name: Codex plugin skills drift gate
        run: python3 configs/scripts/regen-codex-plugin.py --check

      # .claude-plugin/plugin.json's version must track the canonical semver
      # published in the Codex manifest, and the manifest must carry NO `agents`
      # key at all: that is not a field this loader honours. `agents/` at the
      # repo root is a generated mirror of `configs/agents/` which the loader
      # finds by convention. The opposite belief was encoded here until
      # 2026-08-29 and was wrong in both directions — see the module docstring
      # of configs/scripts/regen-cc-plugin.py for the measured evidence.
      - name: Claude Code plugin manifest drift gate
        run: python3 configs/scripts/regen-cc-plugin.py --check

      # docs/facts.json holds the cross-doc counts (skills/hooks/agents/scripts).
      # `verify` re-derives them from the filesystem AND checks every *.md
      # against them — `check` alone only compares docs to the recorded values,
      # so adding a skill (which touches no *.md) would leave the local
      # doc-align-check.sh hook silent and every doc quietly wrong.
      # docs/configuration.md promises the .example.json holds "every supported
      # orchestrator key" and "always matches _SETTINGS_DEFAULTS". install.sh
      # copies a HAND-MAINTAINED template, so it tracked nothing: measured
      # 2026-08-29, 33 keys against 75, with one stale key that is no longer a
      # setting at all. Generated now, and enforced here so the promise holds.
      - name: Settings reference drift gate
        run: python3 configs/scripts/regen-settings-example.py --check

      - name: Doc facts drift gate
        run: |
          if ! python3 configs/scripts/doc-align.py verify; then
            echo "::error::doc facts drifted — run: configs/scripts/doc-align.py sync (then commit the result)"
            exit 1
          fi

      # CLAUDE.md's orchestrator import DAG reads as complete, so a module that
      # exists but is absent from it makes an agent conclude the module doesn't
      # exist. Adding a module and describing it must be the same commit.
      - name: Architecture map coverage
        run: python3 configs/scripts/check-arch-map.py

      # Counts and module coverage were gated; where a link *points* was not.
      # Two absorbed skills shipped 150 dead cross-references for months because
      # the sync flattened an upstream tree without rewriting the links inside it.
      - name: Reference resolution
        run: python3 configs/scripts/check-references.py

      # Eight `uses:` lines carried full SHAs; four did not, and those four
      # were both actions in pr-honeypot-check.yml and both in vouch-gate.yml —
      # the two workflows that run on pull_request_target with write scopes
      # against fork PRs. The decision to pin existed; nothing enforced it.
      - name: Action pinning
        run: python3 configs/scripts/check-action-pinning.py

      # Four root documents described overlapping state and nothing said which
      # one wins, so VISION's milestone table could stop at Phase 13 while TODO
      # tracked a finished Phase 14 and neither file looked wrong. Each now
      # declares its role; this keeps open items in exactly one of them.
      - name: Roadmap authority
        run: python3 configs/scripts/check-roadmap-authority.py

      # The /sync skill caps PROGRESS.md at 100 lines and prescribes
      # docs/progress-archive/. It said so in prose only, so the file reached
      # 1,209 lines and the archive directory was never created. A cap stated
      # in prose drifts; this one is checked.
      - name: Progress log cap
        run: python3 configs/scripts/archive-progress.py --check

      # An audit of this repository spent most of its effort on the orchestrator,
      # a layer switched off months earlier. Nothing in the tree said so. This
      # keeps the declaration matching the tree, so the marker cannot rot into
      # the same silence it was written to break.
      - name: Layer declaration
        run: python3 configs/scripts/check-layers.py

      # A skill must not advertise what it does not do. Three convergence
      # rounds found 61, 25 and 26 issues and the count was not falling,
      # because the issues were the same few CLASSES recurring across 138
      # skills. This gates the largest: /create-pr advertised --dry-run and
      # only ever published, which opened a real PR for a run asking to
      # preview. Its own --self-test runs in the pytest job.
      - name: Skill contracts
        run: python3 configs/scripts/check-skill-contracts.py

      # Claude Code lists skills to the model inside a character budget and,
      # over it, keeps descriptions by usage score — a never-used skill is
      # listed by name only and cannot be auto-selected. Measured 2026-09-20:
      # 8,000 chars on a 200k model against a 59k-char listing, 103 of 144
      # skills never used. configs/settings-skill-overrides.json is GENERATED
      # (hub-family sub-skills name-only, the fraction that fits); this is its
      # drift gate, and the next step proves the shipped settings still fit.
      - name: Skill overrides drift gate
        run: python3 configs/scripts/regen-skill-overrides.py --check

      - name: Skill listing budget
        run: python3 configs/scripts/check-skill-listing.py

      # Reports, never blocks. Five convergence rounds found 61, 25, 34, - and
      # 23 issues, and the count would not fall because 43% of each round were
      # SIBLINGS of the previous round's own fixes: a fact corrected in the file
      # someone was looking at and left standing in three others. This asks, of
      # every fact a diff removes, whether it survives elsewhere. It cannot know
      # intent, so it prints and exits 0; --strict is for a human who wants it
      # to fail.
      # Blocks on a NEW phantom, and on a baseline entry that no longer fires.
      # The 19 known ones are recorded IN the script; that list shrinks only.
      - name: Runnable paths
        run: python3 configs/scripts/check-runnable-paths.py

      - name: Sibling facts (report only)
        # On a PUSH to main, actions/checkout leaves origin/main at the pushed
        # SHA, so `origin/main...HEAD` is empty and this reported a clean tree
        # on every commit it was supposed to examine. `${{ github.event_name }}`
        # picks the range that has content, and `|| true` is gone: the script
        # exits 0 on findings by design, and the only thing `|| true` was
        # hiding was the RuntimeError a broken range now raises on purpose.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
            python3 configs/scripts/check-sibling-facts.py --range "origin/${{ github.base_ref }}...HEAD"
          else
            # actions/checkout is shallow by default, so HEAD~1 is not present
            # and the script — correctly — refuses to call an unresolvable
            # range a clean tree.
            git fetch --no-tags --deepen=1 || true
            python3 configs/scripts/check-sibling-facts.py --range 'HEAD~1..HEAD'
          fi

      # CLAUDE.md's pre-commit checklist claims to be what makes CI pass. It
      # had drifted twice (df802c3, then again by 2026-08-29), both times
      # leaving a local run green against a list that did not cover the build.
      # This compares the gates the workflows invoke against the gates that
      # section names, so the claim is enforced rather than asserted.
      - name: Pre-commit checklist covers CI
        run: python3 configs/scripts/check-ci-checklist.py

  pytest:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      # fetch-depth 2, not the default 1: tests/test_sibling_facts_range.py
      # ::test_a_resolvable_range_still_reports shells the gate with
      # `--range HEAD~1..HEAD` and asserts it does NOT print "RANGE NOT
      # CHECKED". Under a depth-1 checkout HEAD~1 does not exist, the gate
      # correctly refuses, and the test fails on the runner while passing on
      # every developer machine. 0c7bf91 fixed this class for the syntax-check
      # job (`git fetch --deepen=1`, line 210) and missed that the TEST for it
      # runs here — three consecutive pushes were red on exactly this.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd orchestrator
          pip install -r requirements-dev.txt

      # Types were written and never read: 97.3% of orchestrator core parameters
      # and 87.9% of configs/ carried annotations with ZERO checkers anywhere, so
      # the cost was paid and none of the benefit collected. This step lives in
      # the pytest job, NOT syntax-check, because `pip install -r
      # requirements-dev.txt` already runs here — one pin line governs local and
      # CI, with no second grep-install block to drift. Scope is configs/ only
      # (see mypy.ini): that scope is at zero and can be held there, while
      # orchestrator/ carries ~70 errors and is separate work. Its first run
      # found three real defects, not style: a `.group()` on a possibly-None
      # match in an unattended archiver, an int passed where an (r,g,b) tuple was
      # expected for greyscale images, and a str shadowing a list[str].
      # Runs from the REPOSITORY ROOT, not from orchestrator/. mypy.ini's
      # `files = configs/scripts` is resolved against the working directory, not
      # against the config file, so a `cd orchestrator` first makes it check
      # nothing and exit non-zero — caught here before it shipped.
      - name: Type gate over the load-bearing layer (mypy)
        run: python -m mypy --config-file mypy.ini

      - name: Run tests
        run: |
          cd orchestrator
          python -m pytest tests/ -v

      - name: Run sanitized provider conformance fixtures
        run: |
          cd orchestrator
          python evals/run_provider_conformance.py

      # Scores judge_diversity.test_integrity against a labelled corpus of
      # reward hacks and honest test edits. Offline and deterministic — no
      # network, no model — and it prints the per-case scoreboard, so a
      # regression names which hack started slipping through.
      # The red-phase audit is the only instrument that measures "an added test
      # already passed at base". An instrument that cannot go red is
      # indistinguishable from a clean codebase, and this one has shipped that
      # failure before — an unrecognised pytest argument made every commit
      # report 0 passed, and the 0% fire rate read as good news. The self-test
      # runs one positive and one negative control and fails if either is wrong.
      # No RED_PHASE_PYTHON here: this job installs dependencies into the
      # runner's system Python rather than a venv, and the script already
      # falls back to sys.executable when orchestrator/.venv is absent.
      # Pinning the venv path made the step fail with FileNotFoundError on a
      # runner that has no venv at all.
      - name: Red-phase audit self-test (can the harness go red?)
        run: python3 configs/scripts/red-phase-audit.py --self-test

      # Same question of the poll detector, and it is not hypothetical: the
      # mutation guard matched the `>/` of `2>/dev/null`, so every session ever
      # scanned reported zero polls. A detector that cannot fire reports a
      # disciplined session exactly like an undisciplined one.
      - name: Poll-detector self-test (can it go red?)
        run: python3 configs/scripts/workflow-scorecard.py --self-test

      # Fourth instrument in this repo to arrive with the question answered.
      # Its first version accepted the bare word instead of the literal --flag,
      # and could not fire: flag names are common English words, so /brief
      # passed with its --all handling deleted.
      - name: Skill-contract gate self-test (can it go red?)
        run: python3 configs/scripts/check-skill-contracts.py --self-test

      - name: Score the test-integrity detector against the reward-hack corpus
        run: |
          cd orchestrator
          python evals/run_hack_eval.py

  shell-tests:
    name: Shell Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # Hard gate: a failing shell test fails the build (no continue-on-error,
      # no warning-swallow — that combination hid 11 real failures for weeks)
      - name: Run loop system tests
        run: bash tests/test-loop.sh

      # Commit-path gate: checks.sh secret scan + committer.sh wiring
      - name: Run commit-path checks tests
        run: bash tests/test-checks.sh

      # Skill routing (shell side): domain-detect classification, skill-suggest
      # PostToolUse hints + throttle, session-context project-aware routing +
      # no-catalog-reinjection regression guard
      - name: Run skill-routing tests
        run: bash tests/test-skill-routing.sh

      # Delivery scope: one independently reviewable feature per PR, enforced
      # consistently from orchestration through review and merge.
      - name: Run PR scope-policy tests
        run: bash tests/test-pr-scope-policy.sh

      # Nth-strike escalation: 3+-hit rules become REQUIRED hook conversions
      - name: Run auto-audit escalation tests
        run: bash tests/test-audit.sh

      # Worktree env bootstrap (run-tasks-parallel.sh) + per-file post-edit
      # lint fast path (post-tool-use-lint.sh)
      - name: Run worktree env tests
        run: bash tests/test-worktree-env.sh

      # Path-scoped rule injection (rule-injector.sh): glob match, dedup,
      # missing-dir and malformed-frontmatter failure paths
      - name: Run rule-injector tests
        run: bash tests/test-rule-injector.sh

      # Mid-flight worker steering (mailbox-drain.sh): drain + at-most-once,
      # sanitizer/symlink rails, byte cap, concurrent-drain atomicity
      - name: Run mailbox-drain tests
        run: bash tests/test-mailbox-drain.sh

      # Correction PAIRING (edit-shadow + revert + correction-detector): the
      # "AI did X → rejected" pair, repeat flag, and the gate (no signal → no inject)
      - name: Run correction-pairing tests
        run: bash tests/test-correction-pairing.sh

      - name: Run session-scorecard tests
        run: bash tests/test-session-scorecard.sh

      # Hook delivery channels (CC 2.1): SessionEnd shadow cleanup (attribution,
      # no session_id, missing dir, CP_SHADOW_DIR override), post-edit-check
      # exit-2 asyncRewake findings vs silent success, skill-suggest sync
      # delivery bounded by its in-script `timeout 5`, and the settings wiring
      # that makes all three reachable
      - name: Run hook delivery tests
        run: bash tests/test-hooks.sh

      # Post-compaction re-injection (SessionStart source=compact): goal re-inject,
      # rule-sentinel re-arm, source guard, staleness guard, silent-when-empty
      - name: Run post-compact-reinject tests
        run: bash tests/test-post-compact-reinject.sh

      # Context-budget warning delivery (Round-4 dead-code fix): drain +
      # at-most-once, task-id sanitizer, symlink refusal, no-env/no-file no-ops
      - name: Run context-warning-drain tests
        run: bash tests/test-context-warning-drain.sh

      # Idempotent dev-server discovery/start (Round-4, Thorsten Ball): cold
      # start, fast reuse, 4-way concurrent-caller race (exactly one real
      # process), unreachable/no-dev-script, CLAUDE.md port parsing, reuse of
      # an untracked external server. Skips gracefully if node/curl/jq missing.
      - name: Run ensure-dev-server tests
        run: bash tests/test-ensure-dev-server.sh

      # Per-line timestamped log + exit-code fidelity (Round-4, Thorsten Ball
      # log-merging pattern — /verify appends browser console output to this
      # same file tagged [browser])
      - name: Run quiet-run tests
        run: bash tests/test-quiet-run.sh

      # Adversarial-review finding (wiring/deploy-gap): this suite existed since
      # commit cea7729/c61e4c2 (MCP context-budget audit, Round-4/tw93) but was
      # never added here — 27 real test cases silently not running in CI.
      - name: Run scan-health tests
        run: bash tests/test-scan-health.sh

      # pre-tool-guardian is the blast door for rm -rf / force-push / DROP, and
      # until now it had no suite here at all. It shipped two defects that a
      # test would have caught the day they landed: per-LINE rm matching blocked
      # benign temp deletes that merely shared a line with a home path, and the
      # `~` alternative could never match `~` or `~/…` (so `rm -rf ~` was allowed
      # outright). Both directions are asserted.
      - name: Run pre-tool-guardian tests
        run: bash tests/test-pre-tool-guardian.sh

      # The watchdog's worker selection had no test and matched none of the
      # commands worker_provider.py builds, so it freed no memory under
      # pressure. Pure-function selection, exercised against synthetic
      # `ps` tables — no processes are spawned or signalled.
      - name: Run memory-watchdog selection tests
        run: bash tests/test-memory-watchdog.sh

      # Loop argument parsing + planning-budget defaults. The documented
      # `--dry-run goal.md` order used to set GOAL_FILE=--dry-run, and the
      # supervisor budget defaulted to 120s through two separate stuck runs.
      - name: Run loop argument tests
        run: bash tests/test-loop-args.sh

      # ci-local.py runs THESE workflows on a developer machine, so hosted
      # minutes are the receipt rather than the gate. The thing it must never
      # do is execute nothing and exit 0 — a green light for a broken push.
      # This asserts it goes red on a failing step, stops a job at the first
      # failure like GitHub does, and reports every skip with its reason.
      - name: Run local-CI runner tests
        run: bash tests/test-ci-local.sh

      # The GEO skill described what to score and never said how to obtain it,
      # and its only named integration was a PAID one whose tool names had been
      # deleted upstream. The owner's constraint is no APIs that cost money, so
      # this pins both: the skill states its acquisition, and every tool it
      # names is free and keyless.
      - name: Run SEO/GEO skill tests
        run: bash tests/test-seo-geo.sh

  install-test:
    name: Install Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # Executes install.sh against a throwaway $HOME under /tmp and asserts
      # what it ships: hooks executable, skill catalog generated, learned
      # Cross-Project Rules surviving reinstall, settings merge, symlinks
      - name: Run install test
        run: bash tests/test-install.sh

  # Nothing told this repo when a pinned dependency became vulnerable, and the
  # first run's answer was not "slightly behind": fastapi==0.131.0 required
  # `starlette<1.0.0`, and 0.52.1 is the last 0.x starlette ever published, so
  # the pin locked an unauthenticated control plane to two HIGH advisories with
  # no in-range remedy. The reason nobody knew is that nobody looked.
  #
  # Weekly, never per-push: an advisory can drop with no code change here, and a
  # gate that reddens every open PR on someone else's disclosure schedule
  # teaches people to ignore red. Same trigger as real-api-loop — but this job
  # is NOT key-gated: it needs network, not credentials, so it runs on forks
  # too. Do not move it into the key-gated set by analogy.
  dependency-audit:
    name: Dependency Audit (weekly)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # pip-audit resolves the FULL transitive set, not just what these files
      # name — `cryptography` reaches this project only via mcp -> pyjwt[crypto]
      # and is exactly where the next HIGH turned up. Pinned like every other
      # tool here so the gate does not change under us.
      - name: Audit Python dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit --progress-spinner=off \
            -r orchestrator/requirements.txt \
            -r orchestrator/requirements-dev.txt

      # Deliberately NOT `npm audit --omit=dev`. Omitting dev is what let a
      # manual check report "0 vulnerabilities" while four highs sat in the
      # build toolchain — a vite dev-server arbitrary-file-read among them,
      # which matters on any machine where someone runs `npm run dev`.
      # `--audit-level=high` is also deliberate: the build chain keeps producing
      # lows, and a job nobody can keep green is a job nobody reads.
      - name: Audit npm dependencies
        run: |
          cd orchestrator/web
          npm ci
          npm audit --audit-level=high

  # Key-gated REAL-API tier (two-tier pattern): one cheap live-CLI loop
  # scenario (~$0.05) that catches mock-vs-real claude drift — flag changes,
  # `claude -p` output format, supervisor JSON extraction. Never runs on
  # push/PR; the script self-gates on credentials (no ANTHROPIC_API_KEY →
  # prints SKIP and exits 0, so forks and keyless runs stay green).
  real-api-loop:
    name: Real-API Loop Tier (key-gated)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run real-API loop tier
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash tests/test-loop.sh --real

  provider-live-anthropic:
    name: Provider Live Smoke — Anthropic (key-gated)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Run read-only Anthropic catalog smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python orchestrator/evals/run_provider_conformance.py --live anthropic

  provider-live-openai:
    name: Provider Live Smoke — OpenAI (key-gated)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Run read-only OpenAI catalog smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
