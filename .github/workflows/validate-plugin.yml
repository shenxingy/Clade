name: Validate Plugin Manifest

# Gate on the authoritative Claude Code manifest validator, not a hand-rolled
# schema check that would drift from the real plugin loader. Installing the
# CLI is this job's own responsibility — it must never fall back to "skip
# when unavailable", because a skipped job reports green on a broken
# manifest exactly as convincingly as a passing one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-plugin-manifest:
    name: Validate Plugin Manifest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # --strict decision (verified locally on CLI v2.1.227, 2026-08-10, not
      # guessed): `claude plugin validate --help` confirms --strict is a real,
      # documented flag ("Treat warnings as errors (exit 1). Use in CI to
      # fail on unrecognized fields, missing metadata, and other issues that
      # the runtime tolerates.") — so this is not the "flag unknown" case.
      #
      # --strict was briefly dropped because it failed on the CLEAN manifest:
      # with only .claude-plugin/plugin.json present, the validator also
      # inspected the repo root and warned that CLAUDE.md there is not loaded
      # as plugin context. Adding .claude-plugin/marketplace.json changed the
      # entry point — validation now resolves the marketplace and descends into
      # its plugins (errors are reported as `plugins[0] plugin.json → …`), and
      # that root-level warning no longer fires. --strict passes clean, so the
      # documented condition for restoring it is met.
      #
      # Proofs, run locally against CLI v2.1.227 in a throwaway copy of
      # .claude-plugin/ with configs/ symlinked in (repo left untouched):
      #
      #   clean manifests            → validate . = 0,  validate . --strict = 0
      #   keywords: [] → "string"    → validate . = 1   (schema error)
      #   skills: → missing dir      → validate . = 1   ("Path not found",
      #                                 i.e. component paths are really walked)
      #   extra unknown field        → validate . = 0,  --strict = 1
      #                                 ("Unknown field 'x'. Claude Code
      #                                  ignores it at load time.")
      #
      # That last row is why the gate runs --strict rather than plain validate:
      # a hook/manifest field that does not exist is silently ignored at load
      # time, so it reads as working configuration while doing nothing. This
      # repo shipped exactly that failure (invented rewakeMessage /
      # rewakeSummary keys on a command hook) — non-strict validation is blind
      # to it, --strict is not.
      - name: Validate plugin and marketplace manifests
        run: claude plugin validate . --strict
