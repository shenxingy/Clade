<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="title desc">
  <title id="title">Clade 工作流</title>
  <desc id="desc">三个相连阶段：你的任务、Clade 工作流和可审阅的结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#79c0ff" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="900" height="290" rx="18" fill="#0d1117"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <path d="M280 130H320" stroke="#79c0ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M570 130H610" stroke="#79c0ff" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="40" y="48" width="240" height="164" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <circle cx="70" cy="82" r="10" fill="#f0883e"/>
      <text x="94" y="90" fill="#e6edf3" font-size="20" font-weight="700">你的任务</text>
      <text x="64" y="135" fill="#e6edf3" font-size="16">仓库中的小改动</text>
      <text x="64" y="170" fill="#79c0ff" font-size="16" textLength="196" lengthAdjust="spacingAndGlyphs">Claude Code · Codex · MCP</text>
    </g>
    <g>
      <rect x="330" y="48" width="240" height="164" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <circle cx="360" cy="82" r="10" fill="#79c0ff"/>
      <text x="384" y="90" fill="#e6edf3" font-size="20" font-weight="700">Clade 工作流</text>
      <text x="354" y="135" fill="#e6edf3" font-size="16">规划 → 修改 → 验证</text>
      <text x="354" y="170" fill="#7ee787" font-size="16">运行仓库检查</text>
    </g>
    <g>
      <rect x="620" y="48" width="240" height="164" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <circle cx="650" cy="82" r="10" fill="#7ee787"/>
      <text x="674" y="90" fill="#e6edf3" font-size="20" font-weight="700">可审阅的结果</text>
      <text x="644" y="135" fill="#e6edf3" font-size="16">差异 + 验证证据</text>
      <text x="644" y="170" fill="#f0883e" font-size="16">获授权后提交 / 发起 PR</text>
    </g>
    <text x="450" y="255" text-anchor="middle" fill="#8b949e" font-size="16">工作流示意 · 编排器可选</text>
  </g>
</svg>
