<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <!--
    GitHub social preview, 1280x640. Upload by hand: Settings → General →
    Social preview → Edit → Upload an image. There is no API for it, so the
    live card only changes when someone re-uploads assets/social-preview.png.

    No counts on purpose. The previous card said "29 Skills · 14 Hooks ·
    5 Agents" while the tree held 148 / 34 / 40: a hand-uploaded image cannot
    be kept in step by doc-align, so it states only facts that do not move.

    Render: rsvg-convert -w 1280 -h 640 social-preview.svg -o social-preview.png
    Content stays >= 88px from every edge: X/Twitter crops 2:1 to 1.91:1.
  -->
  <defs>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.22" />
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#0d1117" />
  <rect width="1280" height="640" fill="url(#glow)" />

  <!-- === CLADOGRAM (right-angle bifurcating; branch colours match the legend) === -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Root + trunk -->
    <line x1="800" y1="320" x2="856" y2="320" stroke="#e6edf3" stroke-width="4" opacity="0.7" />
    <line x1="856" y1="200" x2="856" y2="440" stroke="#e6edf3" stroke-width="3.5" opacity="0.55" />

    <!-- Upper clade -->
    <line x1="856" y1="200" x2="936" y2="200" stroke="#e6edf3" stroke-width="3" opacity="0.5" />
    <line x1="936" y1="140" x2="936" y2="260" stroke="#e6edf3" stroke-width="3" opacity="0.45" />

    <!-- skills (blue) -->
    <line x1="936" y1="140" x2="1040" y2="140" stroke="#79c0ff" stroke-width="3.5" />
    <line x1="1040" y1="104" x2="1040" y2="176" stroke="#79c0ff" stroke-width="2.5" opacity="0.7" />
    <line x1="1040" y1="104" x2="1176" y2="104" stroke="#79c0ff" stroke-width="2" opacity="0.6" />
    <line x1="1040" y1="128" x2="1160" y2="128" stroke="#79c0ff" stroke-width="2" opacity="0.6" />
    <line x1="1040" y1="152" x2="1168" y2="152" stroke="#79c0ff" stroke-width="2" opacity="0.6" />
    <line x1="1040" y1="176" x2="1152" y2="176" stroke="#79c0ff" stroke-width="2" opacity="0.6" />
    <circle cx="1176" cy="104" r="4" fill="#79c0ff" />
    <circle cx="1160" cy="128" r="4" fill="#79c0ff" />
    <circle cx="1168" cy="152" r="4" fill="#79c0ff" />
    <circle cx="1152" cy="176" r="4" fill="#79c0ff" />
    <circle cx="1040" cy="140" r="7" fill="#79c0ff" />

    <!-- hooks (green) -->
    <line x1="936" y1="260" x2="1040" y2="260" stroke="#7ee787" stroke-width="3.5" />
    <line x1="1040" y1="236" x2="1040" y2="284" stroke="#7ee787" stroke-width="2.5" opacity="0.7" />
    <line x1="1040" y1="236" x2="1160" y2="236" stroke="#7ee787" stroke-width="2" opacity="0.6" />
    <line x1="1040" y1="260" x2="1176" y2="260" stroke="#7ee787" stroke-width="2" opacity="0.6" />
    <line x1="1040" y1="284" x2="1144" y2="284" stroke="#7ee787" stroke-width="2" opacity="0.6" />
    <circle cx="1160" cy="236" r="4" fill="#7ee787" />
    <circle cx="1176" cy="260" r="4" fill="#7ee787" />
    <circle cx="1144" cy="284" r="4" fill="#7ee787" />
    <circle cx="1040" cy="260" r="7" fill="#7ee787" />

    <!-- Lower clade -->
    <line x1="856" y1="440" x2="936" y2="440" stroke="#e6edf3" stroke-width="3" opacity="0.5" />
    <line x1="936" y1="380" x2="936" y2="500" stroke="#e6edf3" stroke-width="3" opacity="0.45" />

    <!-- agents (orange) -->
    <line x1="936" y1="380" x2="1040" y2="380" stroke="#f0883e" stroke-width="3.5" />
    <line x1="1040" y1="356" x2="1040" y2="404" stroke="#f0883e" stroke-width="2.5" opacity="0.7" />
    <line x1="1040" y1="356" x2="1168" y2="356" stroke="#f0883e" stroke-width="2" opacity="0.6" />
    <line x1="1040" y1="380" x2="1152" y2="380" stroke="#f0883e" stroke-width="2" opacity="0.6" />
    <line x1="1040" y1="404" x2="1176" y2="404" stroke="#f0883e" stroke-width="2" opacity="0.6" />
    <circle cx="1168" cy="356" r="4" fill="#f0883e" />
    <circle cx="1152" cy="380" r="4" fill="#f0883e" />
    <circle cx="1176" cy="404" r="4" fill="#f0883e" />
    <circle cx="1040" cy="380" r="7" fill="#f0883e" />

    <!-- verification gates (purple) -->
    <line x1="936" y1="500" x2="1040" y2="500" stroke="#d2a8ff" stroke-width="3.5" />
    <line x1="1040" y1="488" x2="1040" y2="512" stroke="#d2a8ff" stroke-width="2.5" opacity="0.7" />
    <line x1="1040" y1="488" x2="1160" y2="488" stroke="#d2a8ff" stroke-width="2" opacity="0.6" />
    <line x1="1040" y1="512" x2="1144" y2="512" stroke="#d2a8ff" stroke-width="2" opacity="0.6" />
    <circle cx="1160" cy="488" r="4" fill="#d2a8ff" />
    <circle cx="1144" cy="512" r="4" fill="#d2a8ff" />
    <circle cx="1040" cy="500" r="7" fill="#d2a8ff" />

    <!-- Root node, drawn last so it sits on the trunk -->
    <circle cx="800" cy="320" r="9" fill="#e6edf3" />
  </g>

  <!-- Wordmark -->
  <text x="88" y="222" fill="#f0f6fc" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="148" letter-spacing="-4">Clade</text>

  <!-- Value line (README: "Clade turns agent work into reviewable delivery") -->
  <text x="92" y="306" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="44" letter-spacing="-0.5">Turns agent work into</text>
  <text x="92" y="362" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="44" letter-spacing="-0.5">reviewable delivery.</text>

  <!-- Legend: same four colours as the branches -->
  <text x="92" y="432" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="27"><tspan fill="#79c0ff">skills</tspan><tspan fill="#6e7681" dx="11">·</tspan><tspan fill="#7ee787" dx="11">hooks</tspan><tspan fill="#6e7681" dx="11">·</tspan><tspan fill="#f0883e" dx="11">agents</tspan><tspan fill="#6e7681" dx="11">·</tspan><tspan fill="#d2a8ff" dx="11">verification gates</tspan></text>

  <!-- Works with -->
  <text x="92" y="508" fill="#8b949e" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="22">for</text>
  <rect x="134" y="476" width="168" height="46" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <text x="218" y="507" text-anchor="middle" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="22">Claude Code</text>
  <rect x="314" y="476" width="104" height="46" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <text x="366" y="507" text-anchor="middle" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="22">Codex</text>
  <rect x="430" y="476" width="88" height="46" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <text x="474" y="507" text-anchor="middle" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="22">MCP</text>

  <!-- Address, for when the image travels without its link -->
  <text x="92" y="572" fill="#8b949e" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="20">github.com/shenxingy/clade</text>
</svg>
