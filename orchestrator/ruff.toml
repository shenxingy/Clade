# Python lint gate. CI runs it from the repository root as
#   ruff check --config orchestrator/ruff.toml .
# and the version is pinned in orchestrator/requirements-dev.txt so a local run
# and CI cannot disagree.
#
# WHY THIS FILE LIVES UNDER orchestrator/ RATHER THAN AT THE REPO ROOT: the
# explicit --config above makes one config apply to every Python file in the
# tree, so the location is presentation, not scope. `configs/hooks/
# linter-config-guard.sh` blocks the Edit/Write tool path for ANY file named
# ruff.toml (basename match, any directory) — change this file from a shell
# heredoc and treat the block as the guard doing its job, not as an obstacle.
#
# WHY py_compile was not enough: it proves a file parses. It cannot see a name
# that is never bound. This gate's first run found two F821s, and both were live
# NameErrors that had shipped under a green py_compile gate; the note over
# [lint.per-file-ignores] below records what they were.

target-version = "py312"

# The two GENERATED trees. mcp-package/skills/ is derived from configs/skills/
# via regen-mcp-package.sh and plugins/clade/ via regen-codex-plugin.py, so a
# finding there is a duplicate of one in the source and hand-fixing it is
# forbidden — the drift gates would revert it. Fix configs/skills/ and
# regenerate. (orchestrator/.venv, node_modules and web/dist are already out:
# ruff respects .gitignore.)
extend-exclude = [
    "mcp-package/skills",
    "plugins",
]

[lint]
select = ["E9", "F", "B"]

# `ignore` is a MEASURED BASELINE, not a preference. Every code here has a
# non-zero count on the tree as of 2026-09-02; work a code down to zero and
# delete its line. Never add to this list — a new violation of a selected rule
# is what the gate is for. Counts at freeze (ruff 0.15.4, whole repo):
#   F541 111  F401 105  B008 35  F841 27  B905 17
#   B007  12  B904  10  B009  3  B010  1  B027  1  F811 1
# BLE001 (blind-except, 435 hits) is deliberately NOT selected at all: 178 of
# those are in non-test orchestrator/ code and 89 swallow into a bare pass.
# Selecting it would mean 435 noqa comments or a permanent ignore that reads
# like a decision. It is tracked as debt instead.
ignore = [
    "F401",  # unused-import — worker.py re-exports SwarmManager/WorkerPool on purpose
    "F541",  # f-string without placeholders
    "F811",  # redefinition of unused name
    "F841",  # unused local variable
    "B007",  # unused loop control variable
    "B008",  # function call in default argument (FastAPI Depends(...) idiom)
    "B009",  # getattr with constant
    "B010",  # setattr with constant
    "B027",  # empty method in ABC without abstractmethod
    "B904",  # raise without from inside except
    "B905",  # zip() without explicit strict=
]

# ─── Per-file ignores: EMPTY, and meant to stay that way ────────────────────
# This table parks NOTHING today. Read no live bug into it — the tree has zero
# F821s, and that is the state this gate is holding.
#
# WHY THE TABLE EXISTS AT ALL. This gate's first run (b7ac7e2, 2026-09-02)
# found exactly two F821s across 310 files, and both were real NameErrors
# reachable at runtime rather than style debt:
#
#  1. orchestrator/worker.py's Worker.stop() awaited preserve_worktree_wip()
#     without importing it from worker_utils, so stop() raised NameError before
#     _cleanup_worktree() ran — the WIP was never preserved and the worktree
#     never removed, on every stop path (routes/workers.py, worker_pool's
#     timeout/stuck kills, swarm.py and session.py, none of which wrapped it).
#
#  2. configs/skills/blog-notebooklm/scripts/ask_question.py read os.environ
#     inside an `except Exception` handler, in a module that never imported os
#     — the error handler itself raised.
#
# BOTH WERE FIXED IN THAT SAME COMMIT and their two parked entries deleted with
# them, which is the whole rule this table lives under: an entry is a known live
# bug, never a baseline, and it is deleted in the same commit as its one-line
# fix. Do not add one to make a build green — a new F821 must fail the build.
#
# If you ever do add one: write `**/worker.py`, not `orchestrator/worker.py`,
# because per-file-ignores resolve against the directory ruff was invoked from,
# and this gate has to behave identically for `ruff check --config
# orchestrator/ruff.toml .` at the repo root (CI) and `ruff check .` inside
# orchestrator/ (the obvious local run). A path unambiguous tree-wide needs no
# such glob — but confirm it is: configs/skills/blog-notebooklm/scripts/ and
# configs/scripts/blog/blog-notebooklm/ hold DIFFERENT ask_question.py files,
# and only one of them ever carried bug 2 above.
[lint.per-file-ignores]
