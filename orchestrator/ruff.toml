# Python lint gate. CI runs it from the repository root as
#   ruff check --config orchestrator/ruff.toml .
# and the version is pinned in orchestrator/requirements-dev.txt so a local run
# and CI cannot disagree.
#
# WHY THIS FILE LIVES UNDER orchestrator/ RATHER THAN AT THE REPO ROOT: the
# explicit --config above makes one config apply to every Python file in the
# tree, so the location is presentation, not scope. `configs/hooks/
# linter-config-guard.sh` blocks the Edit/Write tool path for ANY file named
# ruff.toml (basename match, any directory) — change this file from a shell
# heredoc and treat the block as the guard doing its job, not as an obstacle.
#
# WHY py_compile was not enough: it proves a file parses. It cannot see a name
# that is never bound. Both F821 hits below are live NameErrors that shipped
# under a green py_compile gate.

target-version = "py312"

# The two GENERATED trees. mcp-package/skills/ is derived from configs/skills/
# via regen-mcp-package.sh and plugins/clade/ via regen-codex-plugin.py, so a
# finding there is a duplicate of one in the source and hand-fixing it is
# forbidden — the drift gates would revert it. Fix configs/skills/ and
# regenerate. (orchestrator/.venv, node_modules and web/dist are already out:
# ruff respects .gitignore.)
extend-exclude = [
    "mcp-package/skills",
    "plugins",
]

[lint]
select = ["E9", "F", "B"]

# `ignore` is a MEASURED BASELINE, not a preference. Every code here has a
# non-zero count on the tree as of 2026-09-02; work a code down to zero and
# delete its line. Never add to this list — a new violation of a selected rule
# is what the gate is for. Counts at freeze (ruff 0.15.4, whole repo):
#   F541 111  F401 105  B008 35  F841 27  B905 17
#   B007  12  B904  10  B009  3  B010  1  B027  1  F811 1
# BLE001 (blind-except, 435 hits) is deliberately NOT selected at all: 178 of
# those are in non-test orchestrator/ code and 89 swallow into a bare pass.
# Selecting it would mean 435 noqa comments or a permanent ignore that reads
# like a decision. It is tracked as debt instead.
ignore = [
    "F401",  # unused-import — worker.py re-exports SwarmManager/WorkerPool on purpose
    "F541",  # f-string without placeholders
    "F811",  # redefinition of unused name
    "F841",  # unused local variable
    "B007",  # unused loop control variable
    "B008",  # function call in default argument (FastAPI Depends(...) idiom)
    "B009",  # getattr with constant
    "B010",  # setattr with constant
    "B027",  # empty method in ABC without abstractmethod
    "B904",  # raise without from inside except
    "B905",  # zip() without explicit strict=
]

# ─── Known live bugs, not style debt ────────────────────────────────────────
# The gate's first run found exactly two F821s across 310 files, and BOTH are
# real NameErrors reachable at runtime. They are parked here ONLY so this gate
# could land green; each entry is meant to be deleted in the same commit as its
# one-line fix. Do not add to this table — a new F821 must fail the build.
#
#  1. orchestrator/worker.py's Worker.stop() awaits preserve_worktree_wip().
#     The function is defined in worker_utils.py and is missing from that
#     module's `from worker_utils import (...)` list, so stop() raises NameError
#     before _cleanup_worktree() runs — the WIP is never preserved and the
#     worktree is never removed. Reached from routes/workers.py, worker_pool's
#     timeout/stuck kills, swarm.py and session.py, none of which wrap the call.
#     Fix: add `preserve_worktree_wip,` to that import list.
#
#  2. configs/skills/blog-notebooklm/scripts/ask_question.py:175 reads
#     os.environ inside an `except Exception` handler, in a module that never
#     imports os — the error handler itself raises.
#     Fix: add `import os` to the stdlib import block.
[lint.per-file-ignores]
# `**/worker.py` rather than `orchestrator/worker.py` because per-file-ignores
# resolve against the directory ruff was invoked from, and this gate has to
# behave identically for `ruff check --config orchestrator/ruff.toml .` at the
# repo root (CI) and `ruff check .` inside orchestrator/ (the obvious local
# run). `orchestrator/worker.py` is the only worker.py in the tree. The
# blog-notebooklm entry needs no such glob: it is never reached from inside
# orchestrator/, and `configs/scripts/blog/blog-notebooklm/ask_question.py` is
# a DIFFERENT file that does not carry the bug and must stay covered.
