# Type gate over the load-bearing terminal layer.
#
# SCOPE IS THE POINT. `configs/scripts/*.py` is at zero errors today and can be
# held there; `orchestrator/` carries roughly 70 and `orchestrator/tests/` 187,
# so including them would mean shipping a baseline file that only ever grows
# excuses. A gate at zero over a real scope beats a gate at "no worse than
# yesterday" over everything.
#
# Not strict mode, deliberately. The errors this found on its first run were
# real defects, and every one came from default checks: a `.group()` on a
# possibly-None match in an unattended archiver, an int passed where an (r,g,b)
# tuple was expected for greyscale images, a str shadowing a list[str]. Strict
# mode would have buried those under hundreds of missing-annotation notes.

[mypy]
files = configs/scripts
ignore_missing_imports = True
warn_redundant_casts = True
# warn_unused_ignores is OFF, and it is not laziness. It fights
# ignore_missing_imports by construction: design-lint.py guards its optional
# PIL import with `# type: ignore`, which this config then makes redundant, so
# the flag reports five errors on five correct defensive lines. Turning it on
# would mean deleting suppressions that are right for anyone running mypy
# without this config.
exclude = (^configs/scripts/(ads|blog|seo)/|/__pycache__/)

# ads/, blog/ and seo/ are absorbed upstream skill code with their own
# conventions (ads/analyze_landing.py alone carries 37 errors). They are
# excluded rather than annotated by us — the same call install.sh's
# LINE_LIMIT_EXCEPTIONS makes for upstream-synced files. Removing an entry from
# this list is how the scope grows; adding one is how it stops meaning anything.
